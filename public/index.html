<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Awesome Host Manager</title>
    <link rel="icon" href="images/logo-16.png" />
    <link rel="stylesheet" href="./style.css" />
    <style>
        .toastify {
            padding: 11px 16px;
            color: #f7f0e4;
            display: inline-block;
            border: 1px solid #24251f;
            box-shadow: 6px 7px 0 rgba(44, 38, 28, 0.14);
            background: #24251f;
            position: fixed;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.215, 0.61, 0.355, 1);
            border-radius: 1px;
            cursor: pointer;
            text-decoration: none;
            max-width: calc(100% - 32px);
            z-index: 2147483647;
            font-family: "Cascadia Mono", Consolas, monospace;
            font-size: 11px;
            line-height: 1.45;
        }

        .toastify.on {
            opacity: 1;
        }

        .toast-close {
            background: transparent;
            border: 0;
            color: #f7f0e4;
            cursor: pointer;
            font-family: inherit;
            font-size: 1em;
            opacity: 0.4;
            padding: 0 5px;
        }

        .toastify-right {
            right: 15px;
        }

        .toastify-left {
            left: 15px;
        }

        .toastify-top {
            top: -150px;
        }

        .toastify-bottom {
            bottom: -150px;
        }

        .toastify-rounded {
            border-radius: 25px;
        }

        .toastify-avatar {
            width: 1.5em;
            height: 1.5em;
            margin: -7px 5px;
            border-radius: 2px;
        }

        .toastify-center {
            margin-left: auto;
            margin-right: auto;
            left: 0;
            right: 0;
            max-width: fit-content;
            max-width: -moz-fit-content;
        }

        @media only screen and (max-width: 360px) {
            .toastify-right, .toastify-left {
                margin-left: auto;
                margin-right: auto;
                left: 0;
                right: 0;
                max-width: fit-content;
            }
        }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="toastify.js"></script>
    <script src="dist/bundle.js"></script>
  </body>
</html>
